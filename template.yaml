AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Clasificador Inteligente de Residuos - Arquitectura Serverless con S3, Lambda, Rekognition, DynamoDB y API Gateway.

Parameters:
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Origen permitido para CORS (usa '*' en desarrollo o 'https://tu-distribucion.cloudfront.net' en produccion)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        BUCKET: !Sub "${AWS::StackName}-imagenes-${AWS::AccountId}"
        TABLE: !Ref ResiduosTable
        ALLOWED_ORIGIN: !Ref AllowedOrigin

Resources:
  # ---------------------------------------------------------------------------
  # API Gateway con CORS habilitado
  # ---------------------------------------------------------------------------
  ClasificadorApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"

  # ---------------------------------------------------------------------------
  # Frontend publico: bucket S3 privado + CloudFront (HTTPS, necesario para la camara del celular)
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Reescribe /api/xxx -> /xxx antes de enviar la peticion a API Gateway
  ApiPathRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-api-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Quita el prefijo /api de la URI
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/api/, '') || '/';
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          # La API se sirve bajo el mismo dominio (/api/*) para no exponer la URL de API Gateway
          - Id: api-gateway
            DomainName: !Sub "${ClasificadorApi}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: /prod
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-gateway
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiPathRewriteFunction.FunctionARN

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ---------------------------------------------------------------------------
  # Bucket S3 para almacenar las fotos temporalmente (con CORS para PUT directo)
  # ---------------------------------------------------------------------------
  ImagenesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-imagenes-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
            AllowedOrigins:
              - !Ref AllowedOrigin
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: EliminarFotosAntiguas
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1

  # ---------------------------------------------------------------------------
  # Tabla DynamoDB para resultados de clasificacion (Always Free Tier: <= 25 RCU/WCU)
  # ---------------------------------------------------------------------------
  ResiduosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-residuos"
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: imagen_id
          AttributeType: S
      KeySchema:
        - AttributeName: imagen_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ---------------------------------------------------------------------------
  # Lambda #1: Genera URL prefirmada para subir foto a S3 (POST /subir)
  # ---------------------------------------------------------------------------
  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: presign.lambda_handler
      Description: Genera una URL prefirmada de S3 para subir la fotografia del residuo.
      Policies:
        - S3WritePolicy:
            BucketName: !Sub "${AWS::StackName}-imagenes-${AWS::AccountId}"
      Events:
        SubirApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClasificadorApi
            Path: /subir
            Method: post

  # ---------------------------------------------------------------------------
  # Lambda #2: Trigger S3 -> Rekognition -> Clasificacion -> DynamoDB
  # ---------------------------------------------------------------------------
  AnalizarFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: analizar.lambda_handler
      Timeout: 30
      Description: Analiza la imagen subida a S3 con Rekognition y guarda la clasificacion en DynamoDB.
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-imagenes-${AWS::AccountId}"
        - DynamoDBWritePolicy:
            TableName: !Ref ResiduosTable
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectLabels
              Resource: "*"
      Events:
        FotoSubidaEvent:
          Type: S3
          Properties:
            Bucket: !Ref ImagenesBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  # ---------------------------------------------------------------------------
  # Lambda #3: Consulta el resultado en DynamoDB (GET /resultado?id=...)
  # ---------------------------------------------------------------------------
  ResultadoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: resultado.lambda_handler
      Description: Consulta el estado y resultado de clasificacion de una imagen en DynamoDB.
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ResiduosTable
      Events:
        ResultadoApi:
          Type: Api
          Properties:
            RestApiId: !Ref ClasificadorApi
            Path: /resultado
            Method: get

Outputs:
  FrontendUrl:
    Description: URL publica (HTTPS) de la aplicacion; compartela con los asistentes
    Value: !Sub "https://${FrontendDistribution.DomainName}/"
  FrontendBucketName:
    Description: Bucket donde se sube el frontend (aws s3 sync frontend/ s3://<bucket>)
    Value: !Ref FrontendBucket
  ApiUrl:
    Description: URL base de API Gateway para colocar en el frontend (index.html)
    Value: !Sub "https://${ClasificadorApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  BucketName:
    Description: Nombre del bucket S3 de imagenes
    Value: !Ref ImagenesBucket
  DynamoDBTableName:
    Description: Nombre de la tabla DynamoDB
    Value: !Ref ResiduosTable
